name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: storefront_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/storefront_test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  docker:
    runs-on: ubuntu-24.04
    env:
      STRIPE_SECRET_KEY: sk_test_placeholder_for_ci
      STRIPE_WEBHOOK_SECRET: whsec_placeholder_for_ci
      ADMIN_TOKEN: admin-token-placeholder-for-ci-only
    steps:
      - uses: actions/checkout@v5
      - name: Build and start the store
        run: |
          docker compose up -d --build
          for i in $(seq 1 60); do curl -sf http://127.0.0.1:3000/health && break; sleep 2; done
      - name: Check the running store
        run: |
          curl -sf http://127.0.0.1:3000/api/products | grep -q '"id":"mug"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/webhooks/stripe -H 'content-type: application/json' -d '{}')" = "400"
      - name: Container logs
        if: always()
        run: docker compose logs
