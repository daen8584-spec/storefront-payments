<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Small Goods Shop</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header class="wrap">
      <h1>Small Goods Shop</h1>
      <p class="muted">A demo store. Payments use Stripe in test mode: pay with card 4242 4242 4242 4242.</p>
    </header>
    <main class="wrap">
      <p id="notice" class="notice" role="status" hidden></p>
      <section aria-labelledby="products-heading">
        <h2 id="products-heading" class="visually-hidden">Products</h2>
        <ul id="products" class="products" aria-busy="true"></ul>
      </section>
      <section aria-labelledby="cart-heading" class="cart">
        <h2 id="cart-heading">Your cart</h2>
        <ul id="cart-items"></ul>
        <p id="cart-empty" class="muted">Nothing here yet.</p>
        <p class="total">Total <strong id="cart-total">$0.00</strong></p>
        <label for="email">Email for the receipt <span class="muted">(optional)</span></label>
        <input id="email" type="email" autocomplete="email" />
        <button id="checkout" type="button" class="button primary" disabled>Pay with Stripe</button>
        <p id="checkout-error" class="error" role="alert" hidden></p>
      </section>
    </main>
    <script type="module" src="/app.js"></script>
  </body>
</html>
